services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: solis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solis_db
      POSTGRES_USER: solis_user
      POSTGRES_PASSWORD: solis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - solis-network

  # Backend Go + Fiber
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solis-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: solis_user
      DB_PASSWORD: solis_password
      DB_NAME: solis_db
      SERVER_PORT: 8080
      JWT_SECRET: your-secret-key-here
      CORS_ALLOWED_ORIGINS: http://localhost:3500
    depends_on:
      - postgres
    networks:
      - solis-network
    ports:
      - "8500:8080"  # Mapeamento conforme solicitado
    volumes:
      - ./backend:/app  # Hot reload com air
      - /app/tmp  # Exclui tmp para evitar conflitos

  # Frontend React (com hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8500
    container_name: solis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - solis-network
    ports:
      - "3500:3000"  # Mapeamento para porta do Vite
    volumes:
      - ./frontend/src:/app/src  # Hot reload do código fonte
      - ./frontend/package.json:/app/package.json
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules  # Evita conflitos com node_modules

volumes:
  postgres_data:
    driver: local

networks:
  solis-network:
    driver: bridge